<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agello</title>
<script type="module" src="/agent-bridge.js"></script>
<style>
  html, body { height: 100%; margin: 0; }
  agent-bridge { height: 100%; border: 0; border-radius: 0; }
</style>
</head>
<body>
  <agent-bridge screen></agent-bridge>
  <script>
    // Keep the pane picked in the drawer across reloads (?server=http://127.0.0.1:<port>).
    const bridge = document.querySelector("agent-bridge");
    const saved = new URLSearchParams(location.search).get("server");
    if (saved && /^http:\/\/127\.0\.0\.1:\d+$/.test(saved)) bridge.setAttribute("server", saved);
    bridge.addEventListener("agent-pane", (e) => {
      const url = new URL(location.href);
      if (e.detail.server === location.origin) url.searchParams.delete("server");
      else url.searchParams.set("server", e.detail.server);
      history.replaceState(null, "", url);
    });
  </script>
</body>
</html>
